[project]
name = "yourlis"
version = "0.1.0"
description = "Modern Laboratory Information System (LIS) built with Python, Flet, and FastAPI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "uvicorn>=0.24.0",
    "fastapi>=0.104.0",
    "flet>=0.21.0",
    "pydantic>=2.4.2",
    "pyodbc>=5.0.1",
    "cryptography>=45.0.2",
    "hl7>=0.4.5",
    "concurrent-log-handler>=0.9.28",
    "portalocker>=2.8.2",
    "websockets>=12.0",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.0.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
